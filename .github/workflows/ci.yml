name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify product rules and data
        run: npm run verify:product

      - name: Verify deterministic engine regressions
        run: npm run verify:engine

      - name: Verify BYOK API boundary
        run: npm run verify:api

      - name: Verify AI editor interactions
        run: npm run verify:ai-ui

      - name: Verify local development and preview API routes
        run: npm run verify:local-api

      - name: Verify local records and plans
        run: npm run verify:launch

      - name: Verify bilingual catalog presentation
        run: npm run verify:presentation

      - name: Verify dashboard records and numeric receipts
        run: npm run verify:dashboard

      - name: Verify sourced nutrition and meal context
        run: npm run verify:nutrition

      - name: Verify food library sources and recognition
        run: npm run verify:food-library

      - name: Verify transactional record storage
        run: npm run verify:records

      - name: Verify seven-day recommendation ranking
        run: npm run verify:history-ranking

      - name: Verify bilingual weekly summaries
        run: npm run verify:weekly-summary
